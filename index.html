<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wien Öffis">
<meta name="theme-color" content="#000000">
<title>Wien Öffis – Live</title>

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20180%20180%22%3E%3Crect%20width%3D%22180%22%20height%3D%22180%22%20rx%3D%2240%22%20fill%3D%22%23141414%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2214%22%20width%3D%22152%22%20height%3D%22152%22%20rx%3D%2222%22%20fill%3D%22%23000%22%2F%3E%3Ctext%20x%3D%2290%22%20y%3D%22122%22%20font-family%3D%22Helvetica%2C-apple-system%2Csans-serif%22%20font-size%3D%2272%22%20font-weight%3D%22900%22%20fill%3D%22%23e8001d%22%20text-anchor%3D%22middle%22%3EU1%3C%2Ftext%3E%3C%2Fsvg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  color: #ffaa00;
  font-family: 'Share Tech Mono', 'Courier New', monospace;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

body {
  position: relative;
  min-height: 100%;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ==================== LED PIXEL-FONT UTILITY ====================
   Echte Pixel-Fonts (VT323 für LED-Text, Press Start 2P für Liniennummer).
   Die Glyphen selbst sind aus diskreten Pixeln aufgebaut — kein CSS-Clip-Trick
   mehr, damit nichts abgeschnitten wird und die Schrift gut lesbar bleibt.
*/
.led-amber-sm,
.led-amber-md,
.led-amber-muted,
.led-white,
.led-green,
.led-green-sm {
  font-family: 'Doto', 'Courier New', monospace;
  font-weight: 700;
  font-optical-sizing: auto;
  font-variation-settings: "ROND" 100;
  line-height: 1;
}
.led-amber-sm, .led-amber-md { color: #ffaa00; }
.led-amber-muted { color: rgba(255,170,0,0.4); }
.led-white { color: #ffffff; }
.led-green, .led-green-sm { color: #00e000; }
.led-red {
  font-family: 'Doto', 'Courier New', monospace;
  font-weight: 900;
  font-variation-settings: "ROND" 100;
  color: #e8001d;
}

/* ==================== LIVE INDICATOR ==================== */
.live {
  position: absolute;
  top: 6px;
  left: 10px;
  font-size: 12px;
  font-family: 'Share Tech Mono', monospace;
  color: #00cc00;
  letter-spacing: 0.04em;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 7px;
  line-height: 1;
}
.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #00cc00;
  animation: live-pulse 1.5s ease-in-out infinite;
}
.live.error { color: #ff453a; }
.live.error .live-dot { background: #ff453a; }
.live.stale { color: #ffd60a; }
.live.stale .live-dot { background: #ffd60a; }
@keyframes live-pulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.3; }
}

/* ==================== MAIN ==================== */
main {
  position: absolute;
  top: 22px;
  left: 0;
  right: 0;
  bottom: 18px;
  display: flex;
  overflow-x: scroll;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  overscroll-behavior-x: contain;
}
main::-webkit-scrollbar { display: none; }

.page {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  scroll-snap-align: center;
  scroll-snap-stop: always;
  display: flex;
  align-items: stretch;
  padding: 0 8px;
  gap: 8px;
}

.left-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 12px;
  min-width: 0;
  padding: 4px 0;
}

.right-col {
  width: 148px;
  display: flex;
  justify-content: center;
  align-items: stretch;
  flex-shrink: 0;
  padding: 4px 0;
}

.station-block {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  min-height: 0;
}

.line-marker {
  width: 110px;
  font-size: 64px;
  text-align: center;
  line-height: 1;
  flex-shrink: 0;
  /* Doto red via .led-red class */
}

.panel {
  flex: 1;
  height: 100%;
  background: #0d0d0d;
  border: 1px solid #2a2a2a;
  border-radius: 10px;
  padding: 12px 14px 18px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
  position: relative;
  min-width: 0;
}

.row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  height: 54px;
}

.arrow {
  font-size: 22px;
  color: #ffaa00;
  flex-shrink: 0;
  line-height: 1;
}

.destination {
  flex: 1 1 0;
  font-size: 30px;
  letter-spacing: 0;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  max-width: 100%;
  line-height: 1;
  /* Doto amber via .led-amber-sm class */
}

.cds {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

.cd {
  width: 50px;
  height: 50px;
  border-radius: 6px;
  background: #1a0800;
  border: 1px solid #b86000;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.cd.hot {
  background: #cc4400;
  border-color: #ff6600;
}

.cd-num {
  font-size: 30px;
  line-height: 1;
  /* Doto via .led-* class added in JS */
}

.brand {
  position: absolute;
  bottom: 3px;
  right: 8px;
  font-size: 10px;
  color: #664400;
  font-family: 'Share Tech Mono', monospace;
  letter-spacing: 0.12em;
  pointer-events: none;
}

/* ==================== CLOCK HOUSING ==================== */
.clock-housing {
  width: 136px;
  background: #141414;
  border: 1px solid #2a2a2a;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 8px 12px;
  position: relative;
  flex: 1;
}

.cet {
  font-size: 11px;
  color: #557755;
  font-family: 'Share Tech Mono', monospace;
  text-align: center;
  letter-spacing: 0.15em;
  line-height: 1;
}

.analog-clock {
  width: 119px;
  height: 119px;
  margin-top: 6px;
  display: block;
  flex-shrink: 0;
}

.digital-clock {
  margin-top: auto;
  font-size: 34px;
  text-align: center;
  line-height: 1;
  letter-spacing: 0;
  /* Doto green via .led-green class */
}

.date {
  font-size: 20px;
  text-align: center;
  margin-top: 8px;
  line-height: 1;
  letter-spacing: 0;
  text-transform: uppercase;
  /* Doto green via .led-green-sm class */
}

/* ==================== PAGER ==================== */
.pager {
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  align-items: center;
  z-index: 10;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: transparent;
  border: 1px solid #ffaa00;
  cursor: pointer;
  padding: 0;
}
.dot.active {
  background: #ffaa00;
}

/* ==================== PORTRAIT FALLBACK ==================== */
@media (orientation: portrait) {
  .page {
    flex-direction: column;
    padding: 8px;
    gap: 8px;
    justify-content: center;
  }
  .right-col {
    width: 100%;
    height: 130px;
    flex-shrink: 0;
  }
  .clock-housing {
    width: auto;
    flex: 1;
    flex-direction: row;
    justify-content: space-around;
    padding: 10px;
  }
  .cet { display: none; }
  .analog-clock { width: 100px; height: 100px; margin-top: 0; }
  .digital-clock { margin-top: 0; font-size: 28px; }
  .date { margin-top: 0; font-size: 16px; }
  .line-marker { font-size: 48px; width: 80px; }
  .station-block { gap: 8px; }
  .panel { padding: 10px 12px 14px; gap: 6px; }
  .row { height: 48px; gap: 8px; }
  .destination { font-size: 22px; }
  .arrow { font-size: 20px; }
  .cd { width: 42px; height: 42px; }
  .cd-num { font-size: 24px; }
}

/* ==================== SHORT LANDSCAPE ==================== */
@media (orientation: landscape) and (max-height: 370px) {
  .line-marker { font-size: 50px; width: 90px; }
  .panel { padding: 10px 12px 14px; }
  .row { height: 46px; }
  .destination { font-size: 24px; }
  .arrow { font-size: 20px; }
  .cd { width: 44px; height: 44px; }
  .cd-num { font-size: 26px; }
  .analog-clock { width: 105px; height: 105px; }
  .digital-clock { font-size: 28px; }
  .date { font-size: 16px; }
}
</style>
</head>
<body>
  <div class="live" id="live">
    <span class="live-dot"></span>
    <span id="liveText">LIVE · ...</span>
  </div>

  <main id="content"></main>

  <div class="pager" id="pager"></div>

<script>
(function() {
  'use strict';

  const STATIONS = [
    {
      name: 'Reumannplatz',
      line: 'U1',
      directions: [
        { label: 'Leopoldau',   rbl: 4101 },
        { label: 'Alaudagasse', rbl: 4128 }
      ]
    },
    {
      name: 'Quellenstraße',
      line: '6',
      directions: [
        { label: 'Burggasse',          rbl: 424 },
        { label: 'Siccardsburggasse',  rbl: 402 }
      ]
    },
    {
      name: 'Knöllgasse',
      line: '1',
      directions: [
        { label: 'Stefan-Fadinger-Pl.', rbl: 401 },
        { label: 'Prater Hauptallee',   rbl: 425 }
      ]
    },
    {
      name: 'Sonnleithnergasse',
      line: '14A',
      directions: [
        { label: 'Reumannplatz', rbl: 758 },
        { label: 'Hetzendorf',   rbl: 767 }
      ]
    }
  ];

  const STATIONS_PER_PAGE = 2;
  const REFRESH_MS = 15000;
  const CLOCK_TICK_MS = 1000;
  const MAX_DEPARTURES = 3;
  const FETCH_TIMEOUT_MS = 5000;
  const STALE_THRESHOLD_MS = 60000;
  const ERROR_THRESHOLD_MS = 120000;

  const PROXIES = [
    { name: 'corsproxy.io', build: u => 'https://corsproxy.io/?'  + encodeURIComponent(u) },
    { name: 'allorigins',   build: u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u) },
    { name: 'codetabs',     build: u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u) },
    { name: 'thingproxy',   build: u => 'https://thingproxy.freeboard.io/fetch/' + u },
    { name: 'corsproxy.org',build: u => 'https://corsproxy.org/?' + encodeURIComponent(u) },
    { name: 'direkt',       build: u => u }
  ];
  let proxyIdx = 0;
  let activeProxy = '';
  let lastSuccess = 0;
  let tickInFlight = false;

  const $content   = document.getElementById('content');
  const $pager     = document.getElementById('pager');
  const $live      = document.getElementById('live');
  const $liveText  = document.getElementById('liveText');
  const DAYS = ['SO','MO','DI','MI','DO','FR','SA'];

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, m =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // ==================== ANALOG CLOCK SVG ====================
  function clockSvg() {
    const ticks = [];
    for (let i = 0; i < 60; i++) {
      const angle = (i * 6 - 90) * Math.PI / 180;
      const major = (i % 5 === 0);
      const outer = 48;
      const inner = major ? 41 : 44.5;
      const x1 = (50 + Math.cos(angle) * inner).toFixed(2);
      const y1 = (50 + Math.sin(angle) * inner).toFixed(2);
      const x2 = (50 + Math.cos(angle) * outer).toFixed(2);
      const y2 = (50 + Math.sin(angle) * outer).toFixed(2);
      const w = major ? 2.2 : 0.9;
      ticks.push('<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke-width="' + w + '"/>');
    }
    return '<svg class="analog-clock" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
      '<circle cx="50" cy="50" r="49" fill="#000"/>' +
      '<g stroke="#00e000" stroke-linecap="round">' + ticks.join('') + '</g>' +
      '<g class="hour-hand" transform="rotate(0 50 50)">' +
        '<line x1="50" y1="56" x2="50" y2="30" stroke="#00e000" stroke-width="3.6" stroke-linecap="round"/>' +
      '</g>' +
      '<g class="minute-hand" transform="rotate(0 50 50)">' +
        '<line x1="50" y1="58" x2="50" y2="13" stroke="#00e000" stroke-width="2.2" stroke-linecap="round"/>' +
      '</g>' +
      '<g class="second-hand" transform="rotate(0 50 50)">' +
        '<line x1="50" y1="60" x2="50" y2="11" stroke="#00e000" stroke-width="0.9" stroke-linecap="round"/>' +
      '</g>' +
      '<circle cx="50" cy="50" r="2.2" fill="#00e000"/>' +
    '</svg>';
  }

  // ==================== SKELETON ====================
  function renderStationBlock(s, si) {
    return '<div class="station-block" data-si="' + si + '">' +
      '<div class="line-marker led-red">' + escapeHtml(s.line) + '</div>' +
      '<div class="panel">' +
        s.directions.map((d, di) =>
          '<div class="row">' +
            '<span class="arrow">▶</span>' +
            '<span class="destination led-amber-sm" id="dest-' + si + '-' + di + '">' + escapeHtml((d.label || '').toUpperCase()) + '</span>' +
            '<div class="cds" id="cds-' + si + '-' + di + '">' +
              '<div class="cd"><span class="cd-num led-amber-muted">·</span></div>' +
              '<div class="cd"><span class="cd-num led-amber-muted">·</span></div>' +
              '<div class="cd"><span class="cd-num led-amber-muted">·</span></div>' +
            '</div>' +
          '</div>'
        ).join('') +
        '<div class="brand">WL · OGD</div>' +
      '</div>' +
    '</div>';
  }

  function buildSkeleton() {
    const pages = [];
    for (let i = 0; i < STATIONS.length; i += STATIONS_PER_PAGE) {
      pages.push({ stations: STATIONS.slice(i, i + STATIONS_PER_PAGE), startIdx: i });
    }

    $content.innerHTML = pages.map(page =>
      '<section class="page">' +
        '<div class="left-col">' +
          page.stations.map((s, idx) => renderStationBlock(s, page.startIdx + idx)).join('') +
        '</div>' +
        '<div class="right-col">' +
          '<div class="clock-housing">' +
            '<div class="cet">CET</div>' +
            clockSvg() +
            '<div class="digital-clock led-green">--:--</div>' +
            '<div class="date led-green-sm">-- --.--</div>' +
          '</div>' +
        '</div>' +
      '</section>'
    ).join('');

    $pager.innerHTML = pages.map((_, i) =>
      '<button class="dot" data-idx="' + i + '" aria-label="Seite ' + (i + 1) + '"></button>'
    ).join('');
    $pager.querySelectorAll('.dot').forEach(d => {
      d.addEventListener('click', () => {
        const idx = parseInt(d.dataset.idx, 10);
        $content.scrollTo({ left: idx * $content.clientWidth, behavior: 'smooth' });
      });
    });
  }

  // ==================== CLOCKS ====================
  function updateClocks() {
    const d = new Date();
    const h = d.getHours();
    const m = d.getMinutes();
    const s = d.getSeconds();

    const digital = pad(h) + ':' + pad(m);
    document.querySelectorAll('.digital-clock').forEach(el => {
      if (el.textContent !== digital) el.textContent = digital;
    });

    const dateStr = DAYS[d.getDay()] + ' ' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1);
    document.querySelectorAll('.date').forEach(el => {
      if (el.textContent !== dateStr) el.textContent = dateStr;
    });

    const secondAngle = s * 6;
    const minuteAngle = m * 6 + s * 0.1;
    const hourAngle   = (h % 12) * 30 + m * 0.5;
    document.querySelectorAll('.hour-hand').forEach(el =>
      el.setAttribute('transform', 'rotate(' + hourAngle.toFixed(2) + ' 50 50)'));
    document.querySelectorAll('.minute-hand').forEach(el =>
      el.setAttribute('transform', 'rotate(' + minuteAngle.toFixed(2) + ' 50 50)'));
    document.querySelectorAll('.second-hand').forEach(el =>
      el.setAttribute('transform', 'rotate(' + secondAngle + ' 50 50)'));
  }

  // ==================== DEPARTURES ====================
  function cleanTowards(s) {
    if (!s) return '';
    return s.split(/[,\/]|\s+bis\s+/i)[0].trim().toUpperCase();
  }

  function emptyCdHTML() {
    return '<div class="cd"><span class="cd-num led-amber-muted">·</span></div>';
  }
  function cdHTML(countdown, hot) {
    const text = countdown === 0 ? '*' : String(countdown);
    const cls = hot ? 'led-white' : 'led-amber-md';
    return '<div class="cd' + (hot ? ' hot' : '') + '"><span class="cd-num ' + cls + '">' + text + '</span></div>';
  }

  // ==================== FETCH ====================
  function fetchWithTimeout(url, ms) {
    return new Promise((resolve, reject) => {
      const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      const opts = { cache: 'no-store' };
      if (ctrl) opts.signal = ctrl.signal;
      const timer = setTimeout(() => { if (ctrl) ctrl.abort(); reject(new Error('timeout')); }, ms);
      fetch(url, opts).then(res => { clearTimeout(timer); resolve(res); })
                     .catch(err => { clearTimeout(timer); reject(err); });
    });
  }

  async function fetchMonitor() {
    const allRbls = [];
    STATIONS.forEach(s => s.directions.forEach(d => {
      if (d.rbl != null && d.rbl !== '' && d.rbl !== 0) allRbls.push(d.rbl);
    }));
    if (!allRbls.length) return [];

    const cacheBuster = '&_=' + Date.now();
    const qs = allRbls.map(r => 'rbl=' + encodeURIComponent(r)).join('&') + cacheBuster;
    const apiUrl = 'https://www.wienerlinien.at/ogd_realtime/monitor?' + qs;

    let lastErr;
    for (let i = 0; i < PROXIES.length; i++) {
      const idx = (proxyIdx + i) % PROXIES.length;
      const p = PROXIES[idx];
      try {
        const res = await fetchWithTimeout(p.build(apiUrl), FETCH_TIMEOUT_MS);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        const data = JSON.parse(text);
        if (!data || !data.data || !data.data.monitors) throw new Error('invalid');
        proxyIdx = idx;
        activeProxy = p.name;
        return data.data.monitors;
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('all failed');
  }

  // ==================== UPDATE ====================
  function update(monitors) {
    STATIONS.forEach((s, si) => {
      const dirData = s.directions.map(d => {
        if (!d.rbl) return { towards: d.label, countdowns: [] };
        const mon = monitors.find(m =>
          m && m.locationStop && m.locationStop.properties &&
          m.locationStop.properties.attributes &&
          String(m.locationStop.properties.attributes.rbl) === String(d.rbl)
        );
        if (!mon || !mon.lines || !mon.lines.length) {
          return { towards: d.label, countdowns: [] };
        }
        const line = mon.lines.find(l => l.name === s.line) || mon.lines[0];
        const towards = line.towards ? cleanTowards(line.towards) : (d.label || '').toUpperCase();
        const deps = (line.departures && line.departures.departure) || [];
        const countdowns = deps
          .map(dep => dep && dep.departureTime && dep.departureTime.countdown)
          .filter(c => typeof c === 'number')
          .slice(0, MAX_DEPARTURES);
        return { towards, countdowns };
      });

      let minC = Infinity;
      dirData.forEach(dd => dd.countdowns.forEach(c => { if (c < minC) minC = c; }));

      let hotConsumed = false;
      dirData.forEach((dd, di) => {
        const $dest = document.getElementById('dest-' + si + '-' + di);
        const $cds  = document.getElementById('cds-'  + si + '-' + di);
        if (!$dest || !$cds) return;
        if (dd.towards) $dest.textContent = dd.towards;
        const html = [];
        for (let i = 0; i < MAX_DEPARTURES; i++) {
          const c = dd.countdowns[i];
          if (typeof c !== 'number') {
            html.push(emptyCdHTML());
          } else {
            const isHot = !hotConsumed && c === minC;
            if (isHot) hotConsumed = true;
            html.push(cdHTML(c, isHot));
          }
        }
        $cds.innerHTML = html.join('');
      });
    });
    lastSuccess = Date.now();
    setStatus('ok');
  }

  function setStatus(state) {
    $live.classList.remove('stale', 'error');
    if (state === 'ok') {
      $liveText.textContent = 'LIVE · ' + activeProxy.toUpperCase();
    } else if (state === 'connecting') {
      $live.classList.add('stale');
      $liveText.textContent = 'VERBINDE...';
    } else if (state === 'stale') {
      $live.classList.add('stale');
      const ago = Math.floor((Date.now() - lastSuccess) / 1000);
      $liveText.textContent = 'STALE · ' + ago + 'S';
    } else {
      $live.classList.add('error');
      $liveText.textContent = 'OFFLINE';
    }
  }

  async function tick() {
    if (tickInFlight) return;
    tickInFlight = true;
    try {
      const monitors = await fetchMonitor();
      update(monitors);
    } catch (e) {
      const age = lastSuccess ? Date.now() - lastSuccess : Infinity;
      setStatus(age > ERROR_THRESHOLD_MS ? 'error' : 'stale');
    } finally {
      tickInFlight = false;
    }
  }

  // ==================== PAGER ====================
  function updateActiveDot() {
    const width = $content.clientWidth;
    if (!width) return;
    const idx = Math.round($content.scrollLeft / width);
    $pager.querySelectorAll('.dot').forEach((dot, i) => {
      dot.classList.toggle('active', i === idx);
    });
  }

  let scrollRaf = null;
  function onScroll() {
    if (scrollRaf) cancelAnimationFrame(scrollRaf);
    scrollRaf = requestAnimationFrame(updateActiveDot);
  }

  // ==================== WAKE LOCK + LIFECYCLE ====================
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) {}
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      tick();
      if (wakeLock === null) requestWakeLock();
    }
  });

  setInterval(() => {
    const age = lastSuccess ? Date.now() - lastSuccess : Infinity;
    if (age > STALE_THRESHOLD_MS) tick();
  }, 5000);

  window.addEventListener('focus', tick);
  window.addEventListener('pageshow', tick);

  document.addEventListener('touchstart', requestWakeLock, { once: true, passive: true });
  document.addEventListener('click',      requestWakeLock, { once: true });

  // ==================== INIT ====================
  buildSkeleton();
  $content.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', updateActiveDot);
  window.addEventListener('orientationchange', () => setTimeout(updateActiveDot, 200));
  updateClocks();
  updateActiveDot();
  setInterval(updateClocks, CLOCK_TICK_MS);
  setStatus('connecting');
  tick();
  setInterval(tick, REFRESH_MS);

})();
</script>
</body>
</html>
